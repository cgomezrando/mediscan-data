name: Actualizar datos offline

on:
  schedule:
    # Día 1 de cada mes a las 02:00 UTC (03:00 en Madrid en invierno)
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar base de datos desde CIMA
        run: python generar_db_offline.py

      - name: Publicar datos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add medicamentos.json.gz version.json
          git commit -m "Datos offline $(date +%F)" || echo "Sin cambios"
          git push
